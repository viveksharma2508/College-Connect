<div class="container my-5" style="max-width: 800px; margin-top: 60px; background: linear-gradient(135deg, #f9f9f9, #e9e9e9); padding: 40px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);">
  <h1 class="h1 text-center" style="font-size: 2.8em; font-weight: 700; color: #222; margin-bottom: 40px; letter-spacing: -1px; text-transform: uppercase;">Write Post</h1>

  <!-- Write Post form -->
  <form>
    <div class="form-group" style="margin-bottom: 30px;">
      <label for="p-title" style="font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 10px; display: block;">Post Title</label>
      <input type="text"
        class="form-control form-control-lg"
        id="p-title"
        placeholder="What is on your mind?"
        style="padding: 20px; border-radius: 12px; font-size: 1.3em; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); transition: all 0.3s ease-in-out; background: #f8f8f8; color: #333;">
    </div>

    <div class="form-group" style="margin-bottom: 40px;">
      <label for="p-body" style="font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 10px; display: block;">Post Body</label>
      <textarea
        class="form-control form-control-sm"
        id="p-body"
        placeholder="Tell us more about it"
        rows="8"
        style="padding: 20px; border-radius: 12px; font-size: 1.2em; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); transition: all 0.3s ease-in-out; background: #f8f8f8; color: #333;">
      </textarea>
    </div>

    <button type="submit" id="write-btn" class="btn btn-primary"
      style="padding: 18px 36px; font-size: 1.3em; background-color: #007bff; border-radius: 25px; border: none; transition: all 0.3s ease-in-out; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); cursor: pointer; text-transform: uppercase; letter-spacing: 1px;"
      onmouseover="this.style.backgroundColor='#0056b3'; this.style.boxShadow='0 6px 15px rgba(0, 0, 0, 0.2)';"
      onmouseout="this.style.backgroundColor='#007bff'; this.style.boxShadow='0 4px 10px rgba(0, 0, 0, 0.1)';">
      Submit
    </button>
  </form>
</div>

<script src="/app/write-post.js"></script>
